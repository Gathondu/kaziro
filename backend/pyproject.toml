[project]
name = "kaziro-backend"
version = "0.1.0"
description = "Kaziro — AI-powered agentic job recommendation backend (FastAPI + LangGraph + Celery)."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Kaziro" }]

dependencies = [
    # Web framework
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32",
    # Validation & settings
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5",
    # Database
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    # Auth & Supabase
    "supabase>=2.8",
    "python-jose[cryptography]>=3.3",
    # Agentic / LLM
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.51",
    "tiktoken>=0.8",
    # Background work
    "celery[redis]>=5.4",
    "redis>=5.0",
    # HTTP & resilience
    "httpx>=0.27",
    "tenacity>=9.0",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-distro>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-celery>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "sentry-sdk[fastapi,celery]>=2.17",
    # Documents
    "weasyprint>=63.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "bleach>=6.1",
    "pypdf>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "vcrpy>=6.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "locust>=2.32",
]

[tool.uv]
package = false

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "alembic/versions",
    ".venv",
    "tests/cassettes",
    # The pre-existing agent files use `from kaziro.*` imports and assorted
    # legacy patterns; they are rewritten / linted in Phase 2 (T2.1+).
    "agents",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function-call-in-default-arg (FastAPI Depends pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"alembic/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# MyPy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]
exclude = [
    "alembic/versions/.*",
    "tests/cassettes/.*",
    "\\.venv/.*",
    # See Ruff exclude note above — agents are typed in Phase 2 (T2.1+).
    "agents/.*",
]

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "vcr.*",
    "factory.*",
    "factory_boy.*",
    "weasyprint.*",
    "jose.*",
    "supabase.*",
    "langgraph.*",
    "langchain_openai.*",
    "pgvector.*",
    "bleach.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "integration: integration tests that touch the DB or external services",
    "calibration: evaluator calibration tests (slow, network-mocked)",
    "load: load tests run via locust",
]
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
    "tests/*",
    "alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
