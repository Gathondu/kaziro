# Alembic configuration. Source-of-truth lives in `backend/alembic/env.py`,
# which reads the DB URL from `backend.config.settings`. Most knobs here
# are intentionally minimal — see the env.py for runtime behaviour.

[alembic]
script_location = alembic
# Repo root so `import backend.*` resolves (package dir is `backend/`, cwd is often `backend/`).
prepend_sys_path = ..
version_path_separator = os
output_encoding = utf-8

# `sqlalchemy.url` is intentionally blank: the URL is injected at runtime
# by env.py from `settings.DATABASE_URL_SYNC`, so different environments
# (local dev, CI, prod) don't need different alembic.ini files.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
