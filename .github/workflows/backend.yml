name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kaziro
          POSTGRES_PASSWORD: kaziro
          POSTGRES_DB: kaziro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kaziro -d kaziro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      LOG_FORMAT: console
      SECRET_KEY: ci-django-secret-key
      DJANGO_DATABASE_URL: postgresql://kaziro:kaziro@localhost:5432/kaziro_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      RESEND_API_KEY: ci-resend-key
      RESEND_FROM_EMAIL: "Kaziro <onboarding@example.com>"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.6"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Python
        run: uv python install 3.14
        working-directory: backend

      - name: Install dependencies
        run: uv sync --frozen --all-extras
        working-directory: backend

      - name: Ruff lint
        run: uv run ruff check .
        working-directory: backend

      - name: Ruff format check
        run: uv run ruff format --check .
        working-directory: backend

      - name: Django system checks
        run: uv run python manage.py check
        working-directory: backend

      - name: Run migrations
        run: uv run python manage.py migrate --noinput
        working-directory: backend

      - name: Django tests
        run: uv run python manage.py test
        working-directory: backend
