name: deploy-aws

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "infra/terraform/**"
      - ".github/workflows/deploy-aws.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1

jobs:
  select-environment:
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.map.outputs.deploy_env }}
      tf_dir: ${{ steps.map.outputs.tf_dir }}
      image_tag: ${{ steps.map.outputs.image_tag }}
    steps:
      - id: map
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "deploy_env=production" >> "${GITHUB_OUTPUT}"
            echo "tf_dir=infra/terraform/environments/production" >> "${GITHUB_OUTPUT}"
          else
            echo "deploy_env=staging" >> "${GITHUB_OUTPUT}"
            echo "tf_dir=infra/terraform/environments/staging" >> "${GITHUB_OUTPUT}"
          fi
          echo "image_tag=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

  backend-image:
    runs-on: ubuntu-latest
    needs: select-environment
    environment: ${{ needs.select-environment.outputs.deploy_env }}
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        id: image
        shell: bash
        run: |
          REPOSITORY="${{ steps.login-ecr.outputs.registry }}/kaziro/${{ needs.select-environment.outputs.deploy_env }}/backend"
          IMAGE_URI="${REPOSITORY}:${{ needs.select-environment.outputs.image_tag }}"
          docker build -f backend/Dockerfile -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

  terraform:
    runs-on: ubuntu-latest
    needs:
      - select-environment
      - backend-image
    environment: ${{ needs.select-environment.outputs.deploy_env }}
    outputs:
      api_base_url: ${{ steps.outputs.outputs.api_base_url }}
      frontend_bucket_name: ${{ steps.outputs.outputs.frontend_bucket_name }}
      frontend_distribution_id: ${{ steps.outputs.outputs.frontend_distribution_id }}
      frontend_domain_name: ${{ steps.outputs.outputs.frontend_domain_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ needs.select-environment.outputs.tf_dir }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: ${{ needs.select-environment.outputs.tf_dir }}
        env:
          TF_VAR_image_tag: ${{ needs.select-environment.outputs.image_tag }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: ${{ needs.select-environment.outputs.tf_dir }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform outputs
        id: outputs
        working-directory: ${{ needs.select-environment.outputs.tf_dir }}
        shell: bash
        run: |
          echo "api_base_url=$(terraform output -raw api_base_url)" >> "${GITHUB_OUTPUT}"
          echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)" >> "${GITHUB_OUTPUT}"
          echo "frontend_distribution_id=$(terraform output -raw frontend_cloudfront_distribution_id)" >> "${GITHUB_OUTPUT}"
          echo "frontend_domain_name=$(terraform output -raw frontend_cloudfront_domain_name)" >> "${GITHUB_OUTPUT}"

      - name: Print terraform outputs (safe)
        working-directory: ${{ needs.select-environment.outputs.tf_dir }}
        shell: bash
        run: |
          echo "api_base_url=$(terraform output -raw api_base_url)"
          echo "frontend_base_url=$(terraform output -raw frontend_base_url)"
          echo "apprunner_service_url=$(terraform output -raw apprunner_service_url)"
          echo "frontend_bucket_name=$(terraform output -raw frontend_bucket_name)"
          echo "frontend_distribution_id=$(terraform output -raw frontend_cloudfront_distribution_id)"
          echo "frontend_domain_name=$(terraform output -raw frontend_cloudfront_domain_name)"
          echo "links=$(terraform output -json links)"

  frontend:
    runs-on: ubuntu-latest
    needs:
      - select-environment
      - terraform
    environment: ${{ needs.select-environment.outputs.deploy_env }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          PUBLIC_API_URL: ${{ needs.terraform.outputs.api_base_url }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Upload artifacts to S3
        run: aws s3 sync build "s3://${{ needs.terraform.outputs.frontend_bucket_name }}" --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ needs.terraform.outputs.frontend_distribution_id }}" --paths "/*"

  smoke:
    runs-on: ubuntu-latest
    needs:
      - terraform
      - frontend
    steps:
      - name: API health check
        run: curl --fail --show-error "${{ needs.terraform.outputs.api_base_url }}/health"

      - name: Frontend health check
        run: curl --fail --show-error "https://${{ needs.terraform.outputs.frontend_domain_name }}"
