name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"
      - ".markdownlint.json"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: markdown lint + link check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: |
            docs/**/*.md
            *.md

      - name: link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail --exclude "https?://localhost" --exclude "https?://127\\.0\\.0\\.1" --exclude "https?://example\\.(com|org)" docs/**/*.md *.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
