version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "backend"
    groups:
      django-runtime:
        patterns:
          - "pydantic*"
          - "django*"
          - "dj-database-url"
          - "celery"
          - "redis"
          - "httpx"
          - "structlog"
          - "resend*"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "factory*"
          - "vcr*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      react-stack:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@tanstack/*"
          - "zustand"
          - "daisyui"
      frontend-dev:
        patterns:
          - "eslint*"
          - "prettier*"
          - "@playwright/*"
          - "typescript*"
