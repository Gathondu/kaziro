version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    groups:
      python-runtime:
        patterns:
          - "fastapi"
          - "pydantic*"
          - "sqlalchemy"
          - "alembic"
          - "celery"
          - "redis"
          - "httpx"
          - "structlog"
      python-dev:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "factory*"
          - "vcr*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    groups:
      svelte-stack:
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "vite"
          - "vitest"
      frontend-dev:
        patterns:
          - "eslint*"
          - "prettier*"
          - "@playwright/*"
          - "typescript*"
