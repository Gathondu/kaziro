<!doctype html>
<html lang="en" data-theme="terracotta">
	<head>
		<!-- Pre-paint theme from cookie; logic mirrors `lib/stores/appearance.svelte.ts` (APPEARANCE_COOKIE_KEY). -->
		<script>
			(function () {
				try {
					var k = 'appearance=';
					var raw = null;
					var cookies = document.cookie ? document.cookie.split(';') : [];
					for (var i = 0; i < cookies.length; i++) {
						var entry = cookies[i].trim();
						if (!entry.startsWith(k)) {
							continue;
						}
						try {
							raw = decodeURIComponent(entry.slice(k.length));
						} catch {
							raw = null;
						}
						break;
					}
					var theme = 'terracotta';
					if (raw === 'dark') {
						theme = 'terracotta_dark';
					} else if (raw === 'light') {
						theme = 'terracotta';
					} else if (raw === 'system') {
						if (typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches) {
							theme = 'terracotta_dark';
						}
					} else {
						// Unknown or missing value falls back to system behavior.
						if (typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches) {
							theme = 'terracotta_dark';
						}
					}
					document.documentElement.setAttribute('data-theme', theme);
				} catch {
					/* ignore */
				}
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-base-100 text-base-content">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
