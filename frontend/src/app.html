<!doctype html>
<html lang="en">
	<head>
		<!-- Pre-paint theme from cookie; logic mirrors `lib/stores/appearance.svelte.ts` (APPEARANCE_COOKIE_KEY). Default is system (prefers-color-scheme), not light. -->
		<script>
			(function () {
				try {
					function themeForSystem() {
						if (
							typeof matchMedia !== 'undefined' &&
							matchMedia('(prefers-color-scheme: dark)').matches
						) {
							return 'terracotta_dark';
						}
						return 'terracotta';
					}
					var k = 'appearance=';
					var raw = null;
					var cookies = document.cookie ? document.cookie.split(';') : [];
					for (var i = 0; i < cookies.length; i++) {
						var entry = cookies[i].trim();
						if (!entry.startsWith(k)) {
							continue;
						}
						try {
							raw = decodeURIComponent(entry.slice(k.length));
						} catch {
							raw = null;
						}
						break;
					}
					var theme = themeForSystem();
					if (raw === 'dark') {
						theme = 'terracotta_dark';
					} else if (raw === 'light') {
						theme = 'terracotta';
					} else if (raw === 'system') {
						theme = themeForSystem();
					}
					// missing / unknown cookie: keep themeForSystem() (default = system)
					document.documentElement.setAttribute('data-theme', theme);
				} catch {
					/* ignore */
				}
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Handlee&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
			rel="stylesheet"
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-100 text-base-content min-h-screen">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
