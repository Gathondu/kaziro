<!doctype html>
<html lang="en" data-theme="terracotta">
	<head>
		<!-- Pre-paint theme from localStorage; logic mirrors `lib/stores/appearance.svelte.ts` (APPEARANCE_STORAGE_KEY). -->
		<script>
			(function () {
				try {
					var k = 'kaziro-appearance';
					var raw = localStorage.getItem(k);
					var theme = 'terracotta';
					if (raw === 'dark') {
						theme = 'terracotta_dark';
					} else if (raw === 'light') {
						theme = 'terracotta';
					} else {
						if (typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches) {
							theme = 'terracotta_dark';
						}
					}
					document.documentElement.setAttribute('data-theme', theme);
				} catch {
					/* ignore */
				}
			})();
		</script>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-base-100 text-base-content">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
