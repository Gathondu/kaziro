# Local-dev orchestration for Kaziro.
#
# Start everything: ``make dev`` (or ``docker compose up --build``).
# Stop & wipe volumes: ``make down`` (or ``docker compose down -v``).
#
# Service map:
#   * postgres — PostgreSQL 16 + pgvector + pg_trgm.
#   * redis    — Redis 7 used as Celery broker, cache, and pub/sub.
#   * backend  — FastAPI/uvicorn API.
#   * worker   — Celery worker (default queue + agent queues).
#   * beat     — Celery Beat scheduler.
#   * frontend — Vite dev server (HMR).
#
# Non-secret defaults are inlined; sensitive values must come from the
# ``.env`` file at the repo root (mounted via ``env_file``). See
# ``docs/reference/env-vars.md`` for the canonical list.

name: kaziro

x-backend-env: &backend-env
  APP_ENV: development
  LOG_FORMAT: console
  DATABASE_URL: postgresql+asyncpg://kaziro:kaziro@postgres:5432/kaziro
  DATABASE_URL_SYNC: postgresql://kaziro:kaziro@postgres:5432/kaziro
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CORS_ORIGINS: http://localhost:5173,http://frontend:5173

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaziro
      POSTGRES_PASSWORD: kaziro
      POSTGRES_DB: kaziro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaziro -d kaziro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    command:
      [
        "celery",
        "-A",
        "backend.tasks.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=4"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.tasks.celery_app:celery_app inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    command:
      [
        "celery",
        "-A",
        "backend.tasks.celery_app:celery_app",
        "beat",
        "--loglevel=info"
      ]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery .* beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PUBLIC_API_BASE_URL: http://localhost:8000
      PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:5173 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
