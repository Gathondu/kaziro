# Local-dev orchestration for Kaziro.
#
# Start everything: `make dev` or `docker compose up --build`.
# Stop (keeps data): `make down` or `docker compose down`.
# Rebuild and recreate containers (keeps data): `make recreate`.
# Stop and wipe volumes (DESTROYS data): make wipe-volumes CONFIRM=yes

name: kaziro

x-backend-env: &backend-env
  APP_ENV: development
  LOG_FORMAT: console
  DJANGO_DEBUG: "true"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
  DJANGO_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://frontend:3000
  DJANGO_DATABASE_URL: postgresql://kaziro:kaziro@postgres:5432/kaziro
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JOB_SOURCE_DISCOVERY_URL: ${JOB_SOURCE_DISCOVERY_URL:-http://host.docker.internal:3100}
  SCRAPPER_COMPANY_RESEARCH_URL: ${SCRAPPER_COMPANY_RESEARCH_URL:-http://host.docker.internal:3100}

# Docker-in-docker: the devcontainer's own `--add-host=host.docker.internal:...`
# lands in the workspace's /etc/hosts only, so it never reaches containers the
# *inner* daemon starts. Map it explicitly here.
#
# 172.17.0.1 is the workspace's eth0 gateway, i.e. the machine running DevPod
# (your laptop) — not the inner bridge. `host-gateway` is wrong in this nested
# setup: it resolves to docker-init.sh's pinned inner bridge (172.24.0.1), which
# is the workspace container itself.
x-extra-hosts: &extra-hosts
  host.docker.internal: ${DOCKER_HOST_GATEWAY:-172.17.0.1}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kaziro
      POSTGRES_PASSWORD: kaziro
      POSTGRES_DB: kaziro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kaziro -d kaziro" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    extra_hosts: *extra-hosts
    # Apply migrations on startup, then serve with hot reload.
    # Reload dirs exclude the host .venv and other non-source files.
    command: >
      sh -c "python manage.py migrate --noinput &&
      uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
      --reload-dir /app/apps --reload-dir /app/config --timeout-graceful-shutdown 2"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "manage.py", "check" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    extra_hosts: *extra-hosts
    command: [ "celery", "-A", "config.celery:app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "default,parser,evaluator,research,document,maintenance,notification,discovery" ]
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    command: [ "celery", "-A", "config.celery:app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule" ]
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      CI: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's installed node_modules; hides the host's copy.
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: [ "CMD-SHELL", 'node -e "fetch(''http://127.0.0.1:3000'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"' ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
